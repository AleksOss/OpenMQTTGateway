
name: Build ESP8266 RF Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e nodemcuv2-rf

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenMQTTGateway-ESP8266-RF
          path: .pio/build/nodemcuv2-rf/firmware.bin
          if-no-files-found: error
